name: Continuous Deployment

on:
  push:
    branches:
      - main
      - staging
      - test

jobs:
  deploy-backend:
    name: Deploy Server to Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy Production
      - name: Deploy Production (main)
        if: github.ref == 'refs/heads/main'
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Deploy Staging
      - name: Deploy Staging (staging)
        if: github.ref == 'refs/heads/staging'
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Deploy Test
      - name: Deploy Test (test)
        if: github.ref == 'refs/heads/test'
        run: flyctl deploy --config fly.test.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}