name: CI Pipeline

on:
  push:
    branches: [main, test, staging]
  pull_request:
    branches: [main, test, staging]

jobs:
  server-check:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Server Dependencies
        working-directory: ./server
        run: bun install --frozen-lockfile

      - name: Verify TypeScript & Drizzle
        working-directory: ./server
        run: |
          bunx tsc --noEmit
          bun run db:generate

  client-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Client Dependencies
        working-directory: ./client
        run: bun install --frozen-lockfile

      - name: Run Vite Build
        working-directory: ./client
        run: bun run build